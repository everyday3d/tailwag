<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <title>TailWag Studio - 3D Filament Painting &amp; TD Lithophane Engine</title>
    <style>
      #tw-splash {
        position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px; padding: 24px;
        background: radial-gradient(ellipse at 50% 38%, #1a2233 0%, #0b0e14 62%);
        color: #e2e8f0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        transition: opacity .45s ease; text-align: center;
      }
      #tw-splash.tw-hide { opacity: 0; pointer-events: none; }
      #tw-splash .tw-title { font-weight: 800; letter-spacing: .14em; font-size: 26px; color: #fff; }
      #tw-splash .tw-title b { color: #fb923c; }
      #tw-splash .tw-version {
        display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: 999px; font-size: 11px;
        font-weight: 700; letter-spacing: .08em; color: #fb923c; border: 1px solid rgba(251,146,60,.4);
        background: rgba(251,146,60,.12);
      }
      #tw-splash .tw-eco { font-size: 12px; color: #94a3b8; letter-spacing: .06em; }
      #tw-splash .tw-eco b { color: #fbbf24; font-weight: 700; }
      #tw-splash .tw-tipbox { max-width: 460px; min-height: 76px; display: flex; flex-direction: column; gap: 6px; }
      #tw-splash .tw-tiplabel { font-size: 10px; font-weight: 800; letter-spacing: .18em; color: #fb923c; }
      #tw-splash .tw-tip { font-size: 14px; line-height: 1.5; color: #cbd5e1; transition: opacity .35s ease; }
      #tw-splash .tw-tip.tw-fade { opacity: 0; }
      #tw-splash .tw-bar { width: 240px; height: 4px; border-radius: 4px; background: #1e293b; overflow: hidden; }
      #tw-splash .tw-bar i {
        display: block; height: 100%; width: 40%; border-radius: 4px;
        background: linear-gradient(90deg, #f97316, #fbbf24); animation: tw-slide 1.3s ease-in-out infinite;
      }
      @keyframes tw-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(270%); } }
      @keyframes tw-wag { 0% { transform: rotate(-30deg); } 100% { transform: rotate(26deg); } }
      @keyframes tw-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
      @keyframes tw-blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
      @keyframes tw-lines { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
      #tw-splash .tw-tail { transform-origin: 62px 96px; animation: tw-wag .26s ease-in-out infinite alternate; }
      #tw-splash .tw-head { transform-origin: 138px 90px; animation: tw-bob 1.1s ease-in-out infinite; }
      #tw-splash .tw-eye { transform-origin: 146px 58px; animation: tw-blink 3.4s infinite; }
      #tw-splash .tw-wagline { animation: tw-lines .26s ease-in-out infinite alternate; }
      @media (prefers-reduced-motion: reduce) {
        #tw-splash .tw-tail { animation-duration: .8s; }
        #tw-splash .tw-bar i, #tw-splash .tw-head, #tw-splash .tw-wagline { animation: none; }
      }
    </style>
  </head>
  <body class="bg-[#0b0e14] text-slate-100 antialiased selection:bg-orange-500 selection:text-white overflow-hidden">
    <div id="tw-splash" role="status" aria-live="polite" aria-label="TailWag Studio is loading">
      <svg width="300" height="232" viewBox="0 0 220 170" aria-hidden="true">
        <ellipse cx="108" cy="150" rx="68" ry="7" fill="#000" opacity=".35" />
        <!-- wagging tail (behind the body) -->
        <g class="tw-tail">
          <path d="M62 96 C44 88 34 70 38 50" fill="none" stroke="#b86f2f" stroke-width="9" stroke-linecap="round" />
          <path d="M38 56 C37 52 38 50 38 48" fill="none" stroke="#3a2414" stroke-width="9" stroke-linecap="round" />
        </g>
        <g class="tw-wagline" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none">
          <path d="M22 62 C18 56 18 48 22 42" />
          <path d="M14 70 C8 62 8 50 14 42" />
        </g>
        <!-- hind leg and body -->
        <ellipse cx="96" cy="108" rx="46" ry="30" fill="#c8803c" />
        <ellipse cx="78" cy="122" rx="20" ry="24" fill="#b86f2f" />
        <rect x="68" y="138" width="24" height="9" rx="4.5" fill="#f3efe6" />
        <!-- chest and front legs -->
        <ellipse cx="132" cy="112" rx="16" ry="24" fill="#f3efe6" />
        <rect x="124" y="118" width="12" height="30" rx="5" fill="#c8803c" />
        <rect x="120" y="140" width="22" height="9" rx="4.5" fill="#f3efe6" />
        <rect x="140" y="124" width="11" height="24" rx="5" fill="#c8803c" />
        <rect x="137" y="140" width="20" height="9" rx="4.5" fill="#f3efe6" />
        <!-- head -->
        <g class="tw-head">
          <rect x="125" y="78" width="24" height="26" rx="10" fill="#c8803c" />
          <circle cx="140" cy="62" r="25" fill="#c8803c" />
          <path d="M122 42 L112 66 L130 60 Z" fill="#7a431a" />
          <path d="M148 40 L158 24 L162 48 Z" fill="#7a431a" />
          <ellipse cx="164" cy="74" rx="24" ry="17" fill="#2a1a10" />
          <ellipse cx="160" cy="68" rx="19" ry="13" fill="#d9944d" />
          <ellipse cx="183" cy="66" rx="6.5" ry="5" fill="#0d0805" />
          <path d="M160 82 Q172 90 184 80" fill="none" stroke="#0d0805" stroke-width="2.4" stroke-linecap="round" />
          <path d="M163 82 Q170 98 168 106 Q158 100 160 84 Z" fill="#f08a96" />
          <g class="tw-eye">
            <circle cx="148" cy="56" r="4.4" fill="#fff" />
            <circle cx="149.5" cy="56.5" r="2.4" fill="#1a0f08" />
          </g>
          <path d="M140 48 Q148 44 156 48" fill="none" stroke="#7a431a" stroke-width="2.4" stroke-linecap="round" />
          <!-- collar and tag -->
          <rect x="124" y="94" width="28" height="7" rx="3.5" fill="#dc2626" />
          <circle cx="138" cy="106" r="4" fill="#fbbf24" />
        </g>
      </svg>
      <div>
        <div class="tw-title">TAIL<b>WAG</b> STUDIO</div>
        <span class="tw-version" id="tw-version">v__APP_VERSION__</span>
      </div>
      <div class="tw-tipbox">
        <div class="tw-tiplabel">DID YOU KNOW?</div>
        <div class="tw-tip" id="tw-tip">Loading your studio...</div>
      </div>
      <div class="tw-bar"><i></i></div>
      <div class="tw-eco">Part of the <b>BoxerDawg 3D</b> ecosystem</div>
    </div>
    <div id="root"></div>
    <script src="./loading-tips.js"></script>
    <script>
      // Splash behavior runs before the app bundle loads so the screen appears immediately.
      (function () {
        var tips = (window.TAILWAG_TIPS || []).slice();
        var el = document.getElementById('tw-tip');
        if (!el || tips.length === 0) return;
        // Fisher-Yates shuffle: random order, no repeats until every tip has been shown.
        for (var i = tips.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = tips[i]; tips[i] = tips[j]; tips[j] = t;
        }
        var k = 0;
        el.textContent = tips[k];
        window.__twSplashStart = Date.now();
        window.__twSplashTimer = setInterval(function () {
          el.classList.add('tw-fade');
          setTimeout(function () {
            k = (k + 1) % tips.length;
            el.textContent = tips[k];
            el.classList.remove('tw-fade');
          }, 350);
        }, 4500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
