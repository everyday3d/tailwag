<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <title>TailWag Studio - 3D Filament Painting &amp; TD Lithophane Engine</title>
    <style>
      #tw-splash {
        position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px; padding: 24px;
        background: radial-gradient(ellipse at 50% 38%, #1a2233 0%, #0b0e14 62%);
        color: #e2e8f0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        transition: opacity .45s ease; text-align: center;
      }
      #tw-splash.tw-hide { opacity: 0; pointer-events: none; }
      #tw-splash .tw-title { font-weight: 700; font-size: 30px; letter-spacing: -.01em; color: #f8fafc; line-height: 1.1; }
      #tw-splash .tw-version { margin-top: 4px; font-size: 13px; color: #94a3b8; }
      #tw-splash .tw-eco { font-size: 12px; color: #64748b; }
      #tw-splash .tw-tipbox { max-width: 440px; min-height: 72px; display: flex; flex-direction: column; gap: 4px; }
      #tw-splash .tw-tiplabel { font-size: 13px; font-weight: 600; color: #fb923c; }
      #tw-splash .tw-tip { font-size: 14px; line-height: 1.55; color: #cbd5e1; transition: opacity .35s ease; }
      #tw-splash .tw-tip.tw-fade { opacity: 0; }
      /* The boxer is "printed" layer by layer (script below), then comes alive. */
      #tw-splash .tw-nozzle { transition: opacity .4s ease; }
      #tw-splash.tw-done .tw-nozzle { opacity: 0; }
      @keyframes tw-wag { 0% { transform: rotate(-22deg); } 100% { transform: rotate(22deg); } }
      @keyframes tw-blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
      @keyframes tw-ear { 0%, 88%, 100% { transform: rotate(0); } 92% { transform: rotate(-9deg); } 96% { transform: rotate(3deg); } }
      @keyframes tw-breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.012); } }
      #tw-splash .tw-tail { transform-origin: 62px 77px; }
      #tw-splash .tw-eye { transform-box: fill-box; transform-origin: center; }
      #tw-splash .tw-ear { transform-box: fill-box; transform-origin: 20% 15%; }
      #tw-splash .tw-dog { transform-origin: 120px 161px; }
      #tw-splash.tw-done .tw-tail { animation: tw-wag .22s ease-in-out infinite alternate; }
      #tw-splash.tw-done .tw-eye { animation: tw-blink 3.6s .4s infinite; }
      #tw-splash.tw-done .tw-ear { animation: tw-ear 4.2s 1s infinite; }
      #tw-splash.tw-done .tw-dog { animation: tw-breathe 1.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        #tw-splash.tw-done .tw-tail { animation-duration: .9s; }
        #tw-splash.tw-done .tw-eye, #tw-splash.tw-done .tw-ear, #tw-splash.tw-done .tw-dog { animation: none; }
      }
    </style>
  </head>
  <body class="bg-[#0b0e14] text-slate-100 antialiased selection:bg-orange-500 selection:text-white overflow-hidden">
    <div id="tw-splash" role="status" aria-live="polite" aria-label="TailWag Studio is loading">
      <svg width="340" height="255" viewBox="0 0 240 180" aria-hidden="true">
        <defs>
          <!-- Reveal: grows upward one layer at a time while the dog "prints". -->
          <clipPath id="tw-print"><rect id="tw-printrect" x="0" y="0" width="240" height="180" /></clipPath>
          <!-- White silhouette of the dog, so the layer lines only show on the print. -->
          <filter id="tw-white" x="0" y="0" width="1" height="1">
            <feFlood flood-color="#fff" result="f" />
            <feComposite in="f" in2="SourceAlpha" operator="in" />
          </filter>
          <mask id="tw-sil" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="180">
            <use href="#tw-body" filter="url(#tw-white)" />
          </mask>
          <!-- the mask blends into the fawn coat behind the muzzle -->
          <linearGradient id="tw-maskfade" gradientUnits="userSpaceOnUse" x1="170" y1="0" x2="180" y2="0">
            <stop offset="0" stop-color="#211712" stop-opacity="0" />
            <stop offset="1" stop-color="#211712" />
          </linearGradient>
          <pattern id="tw-layers" width="240" height="3" patternUnits="userSpaceOnUse" y="161">
            <rect width="240" height=".7" fill="#000" opacity=".14" />
          </pattern>
        </defs>

        <!-- print bed -->
        <ellipse cx="118" cy="162" rx="86" ry="5" fill="#000" opacity=".35" />
        <rect x="24" y="161" width="192" height="2" rx="1" fill="#2a3446" />
        <!-- nameplate on the front of the bed -->
        <rect x="100" y="167" width="40" height="10" rx="2.5" fill="#1a2232" stroke="#2f3b50" stroke-width=".6" />
        <text x="120" y="174.4" text-anchor="middle" font-size="6.4" font-weight="600" letter-spacing=".3" fill="#e2c49a" font-family="'Segoe UI', system-ui, sans-serif">Tucker</text>

        <g clip-path="url(#tw-print)">
          <g class="tw-dog">
            <!-- Tucker's docked tail: a short stub set high, carried up (behind the body) -->
            <g class="tw-tail">
              <path d="M62 77 C59 74 57.5 70.5 57.8 66.5" fill="none" stroke="#c88a4e" stroke-width="7.5" stroke-linecap="round" />
            </g>

            <g id="tw-body">
              <!-- far legs -->
              <path d="M77 112 C81 124 78 134 74 142 L72 156 C72 159 74 161 77 161 L86 161 C88 161 88 158 85 157 L82 155 L82 144 C86 134 89 124 87 112 Z" fill="#9c5f2c" />
              <path d="M138 112 L139 156 C139 159 141 161 144 161 L154 161 C156 161 156 158 153 157 L150 155 L148 112 Z" fill="#9c5f2c" />
              <path d="M139 151 L149 151 L150 155 C155 157 156 161 154 161 L144 161 C141 161 139 159 139 156 Z" fill="#d9d2c6" />
              <!-- body, neck and near legs -->
              <path d="M128 66 C118 70 92 70 74 70 C66 70 60 74 58 80 C54 90 52 102 56 112 C58 120 64 126 64 132 L60 156 C60 159 62 161 65 161 L76 161 C78 161 78 158 75 157 L72 155 L74 136 C76 128 82 120 84 112 C86 106 92 102 100 102 C110 103 116 110 126 114 L128 156 C128 159 130 161 133 161 L144 161 C146 161 146 158 143 157 L140 155 L140 118 C146 114 152 108 154 98 C156 88 158 80 162 72 L150 46 C142 50 136 58 128 66 Z" fill="#c88a4e" />
              <!-- muscle contours: shoulder blade and back of thigh -->
              <path d="M130 68 C140 76 143 92 139 108 C137 96 134 82 130 68 Z" fill="#b57841" />
              <path d="M59 82 C67 88 73 100 73 116 C67 106 61 94 59 82 Z" fill="#b57841" />
              <!-- white chest blaze and socks -->
              <path d="M155 64 C159 72 160 82 156 93 C153 103 149 110 141 114 C136 114 132 112 130 110 C140 103 146 92 148 80 C149 72 152 66 155 64 Z" fill="#f2ece2" />
              <path d="M128 150 L140 150 L140 155 C146 157 146 161 144 161 L133 161 C130 161 128 159 128 156 Z" fill="#f2ece2" />
              <path d="M61 150 L73 150 L72 155 C78 157 78 161 76 161 L65 161 C62 161 60 159 60 156 Z" fill="#f2ece2" />
              <g transform="translate(152 60) scale(1.1) translate(-152 -60)">
              <!-- head: flat skull, steep stop, short blunt muzzle -->
              <path d="M146 46 C150 38 160 35 168 37 C172 38 174 41 176 45 C178 47 182 47 190 47 C194 47 196 50 196 53 C196 57 194 59 193 60 C194 63 194 67 192 70 C190 73 186 74 183 73 C185 75 186 77 184 78 C180 79 175 77 171 75 C164 72 158 68 155 62 C151 57 147 52 146 46 Z" fill="#c88a4e" />
              <!-- dark ring around the eye -->
              <ellipse cx="167" cy="45.5" rx="5" ry="4" fill="#6b3f1c" opacity=".55" />
              <!-- black mask on the muzzle only -->
              <path d="M175 42 C177 46 180 47 190 47 C194 47 196 50 196 53 C196 57 194 59 193 60 C194 63 194 67 192 70 C190 73 186 74 183 73 C185 75 186 77 184 78 C180 79 176 78 173 76 C170 70 170 60 172 52 C173 48 174 45 175 42 Z" fill="url(#tw-maskfade)" />
              <!-- upturned nose, mouth line, droopy flews over the underbite -->
              <path d="M191 47.5 C194.5 47 196.6 49.5 196.2 52.6 C194.6 53.8 191.6 53.4 190.4 51.4 C189.8 49.6 190 48.2 191 47.5 Z" fill="#0b0705" />
              <path d="M176 66 C182 66 188 64 193 60" fill="none" stroke="#4a3a30" stroke-width="1" stroke-linecap="round" />
              <path d="M183 73 C186.5 71 190 69.5 192 67" fill="none" stroke="#4a3a30" stroke-width=".9" stroke-linecap="round" />
              </g>
              <!-- orange TailWag collar and tag -->
              <path d="M143 56 C147 63 153 69 160 73 L157 78 C150 74 144 68 139 61 Z" fill="#ea580c" />
              <circle cx="155.5" cy="81.5" r="3.2" fill="#fbbf24" />
            </g>

            <!-- printed layer lines across the coat -->
            <rect x="0" y="0" width="240" height="180" fill="url(#tw-layers)" mask="url(#tw-sil)" />

            <!-- folded natural ear, eye and forehead wrinkles (same head scale as above) -->
            <g transform="translate(152 60) scale(1.1) translate(-152 -60)">
            <path class="tw-ear" d="M150 40 C154 33 163 35 163 42 C161 50 155 54 150 52 C148 48 148 44 150 40 Z" fill="#8a4f22" />
            <path d="M157 38.5 C161 37 165 37 168 39.5" fill="none" stroke="#9c5f2c" stroke-width="1.2" stroke-linecap="round" />
            <path d="M159 35.5 C162 34.6 165 34.8 167.5 36.4" fill="none" stroke="#9c5f2c" stroke-width="1" stroke-linecap="round" />
            <g class="tw-eye">
              <circle cx="167" cy="45.5" r="2.6" fill="#24130a" />
              <circle cx="167.9" cy="44.6" r=".8" fill="#fff" />
            </g>
            </g>
          </g>
        </g>

        <!-- hot-end that prints the dog; hidden when the print is done -->
        <g class="tw-nozzle" id="tw-nozzle">
          <rect id="tw-layerline" x="44" y="0" width="156" height=".8" fill="#fb923c" opacity=".55" />
          <g id="tw-head">
            <rect x="-6" y="-14" width="12" height="8" rx="1.5" fill="#475569" />
            <path d="M-3 -6 L3 -6 L1 -1 L-1 -1 Z" fill="#fb923c" />
          </g>
        </g>
      </svg>
      <div>
        <div class="tw-title">TailWag Studio</div>
        <div class="tw-version" id="tw-version">Version __APP_VERSION__</div>
      </div>
      <div class="tw-tipbox">
        <div class="tw-tiplabel">Did you know?</div>
        <div class="tw-tip" id="tw-tip">Loading your studio...</div>
      </div>
      <div class="tw-eco">Part of the BoxerDawg 3D ecosystem</div>
    </div>
    <div id="root"></div>
    <script src="./loading-tips.js"></script>
    <script>
      // Prints the boxer from the bed up, one 3-unit layer at a time, with the hot-end
      // sweeping each layer. When it finishes the dog comes alive (tail wag, blink).
      (function () {
        var splash = document.getElementById('tw-splash');
        var clip = document.getElementById('tw-printrect');
        var line = document.getElementById('tw-layerline');
        var head = document.getElementById('tw-head');
        if (!splash || !clip || !line || !head) return;
        var BED = 161, TOP = 28, STEP = 3, X0 = 44, X1 = 200, DURATION = 6000;
        var layers = Math.ceil((BED - TOP) / STEP);
        var finished = false;
        var done = function () {
          if (finished) return;
          finished = true;
          clip.setAttribute('y', '0');
          clip.setAttribute('height', '180');
          splash.classList.add('tw-done');
        };
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { done(); return; }
        var start = performance.now();
        var frame = function () {
          if (finished) return;
          var p = Math.min(1, (performance.now() - start) / DURATION);
          var exact = p * layers;
          var layer = Math.min(layers, Math.floor(exact));
          var y = BED - layer * STEP;
          clip.setAttribute('y', String(y));
          clip.setAttribute('height', String(180 - y));
          var within = exact - layer;
          var x = layer % 2 === 0 ? X0 + (X1 - X0) * within : X1 - (X1 - X0) * within;
          line.setAttribute('y', String(y - STEP));
          head.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + (y - STEP) + ')');
          if (p < 1) requestAnimationFrame(frame); else done();
        };
        clip.setAttribute('y', String(BED));
        clip.setAttribute('height', String(180 - BED));
        requestAnimationFrame(frame);
        // Animation frames pause while the window is hidden; finish the print anyway.
        setTimeout(done, DURATION + 400);
      })();
      // Splash behavior runs before the app bundle loads so the screen appears immediately.
      (function () {
        var tips = (window.TAILWAG_TIPS || []).slice();
        var el = document.getElementById('tw-tip');
        if (!el || tips.length === 0) return;
        // Fisher-Yates shuffle: random order, no repeats until every tip has been shown.
        for (var i = tips.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = tips[i]; tips[i] = tips[j]; tips[j] = t;
        }
        var k = 0;
        el.textContent = tips[k];
        window.__twSplashStart = Date.now();
        window.__twSplashTimer = setInterval(function () {
          el.classList.add('tw-fade');
          setTimeout(function () {
            k = (k + 1) % tips.length;
            el.textContent = tips[k];
            el.classList.remove('tw-fade');
          }, 350);
        }, 4500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
